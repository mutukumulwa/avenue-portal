# UAT-HF P12.04 — the automated verification gate.
#
# Runs the steps that CAN be automated in this repository today. The gate script
# itself reports the three that cannot (browser, network-fault, full a11y) as
# NOT COVERED rather than omitting them, so a green run here is never mistaken
# for full coverage — see scripts/verification-gate.mjs.
#
# Why `next build` is a CI step and not just a local nicety: on 2026-08-13 a
# `"use server"` export rule shipped a broken `main` while typecheck, ESLint and
# Vitest all passed. That class of failure is invisible to every other step.

name: verification gate

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Steps 4 and 5 migrate a real database. Without one they SKIP, and a skip is
    # a release failure — so CI provides one rather than letting the gate pass
    # while silently covering less.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gate
          POSTGRES_PASSWORD: gate
          POSTGRES_DB: gate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      GATE_DATABASE_URL: postgresql://gate:gate@localhost:5432/gate

      # Needed by `npm ci` itself, before any check runs.
      #
      # `postinstall` is `prisma generate`, which loads prisma.config.ts, which
      # resolves `env("DIRECT_URL")` eagerly inside the defineConfig literal.
      # Prisma 7's `env()` THROWS on an absent variable rather than returning
      # undefined (PrismaConfigEnvError), and `.gitignore` excludes `.env*`, so
      # on a runner there was nothing to supply it: every run of this workflow
      # died in Install at ~28s having verified nothing. Same literal as
      # GATE_DATABASE_URL above because GitHub does not let one key in an `env:`
      # block reference another.
      DIRECT_URL: postgresql://gate:gate@localhost:5432/gate

      # DATABASE_URL is deliberately NOT set here. src/lib/prisma.ts builds its
      # pg Pool from it at module scope, and step 3b (`next build`) runs BEFORE
      # step 4 migrates. Leaving it unset makes an accidental build-time query
      # fail loudly rather than quietly read an empty database. The gate script
      # sets it per-step, for the steps that genuinely want one.
      #
      # The build must never touch a real database in CI.
      SCHEMA_DEPLOY_MODE: skip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned HERE and not in .nvmrc on purpose: Vercel reads .nvmrc, so
          # adding one would silently change the runtime production builds on.
          # Node is currently unpinned for the project (no engines field, no
          # .nvmrc) — worth fixing, but as a deliberate production change, not
          # as a side effect of adding CI.
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Verification gate
        # One command, one exit code.
        #
        # This was two steps: the gate script under `|| true`, and a hand-copied
        # subset of its commands that actually decided the job. That made this
        # file a second, silent implementation of scripts/verification-gate.mjs'
        # list — and the two drifted. `prisma db push --skip-generate` survived
        # here for a day after the script had dropped it, on a flag Prisma 7
        # removed and exits 1 on; and steps 2b, 4b, 5 and 5b existed only in the
        # script, so nothing in CI could fail on them. The live RBAC drift check
        # was added "as gate step 4b" while this file could not run it.
        #
        # `--ci` rather than `--release`: release mode is red by design while
        # steps 6-8 have no automation, which would make every run red and teach
        # people to ignore it. `--ci` tolerates exactly the gaps the script
        # records and nothing else, and fails if one is quietly closed, so the
        # list cannot rot into a rubber stamp.
        run: node scripts/verification-gate.mjs --ci

      - name: Record what this gate does NOT cover
        if: always()
        run: |
          {
            echo "### P12.04 — coverage of the plan's 8 steps"
            echo ""
            echo "| Step | Covered here |"
            echo "|---|---|"
            echo "| 1 typecheck | yes |"
            echo "| 2 eslint (repo-wide, 0 errors) | yes |"
            echo "| 2b RBAC drift (source) | yes |"
            echo "| 3 vitest (full suite) | yes |"
            echo "| 3b next build | yes — added to the plan's list, see AGENTS.md |"
            echo "| 4 fresh db migrate + drift | yes — \`migrate diff --exit-code\`, read-only |"
            echo "| 4b RBAC live drift (database) | yes |"
            echo "| 5 upgrade db preflight + migrate | partial — preflight needs production-shaped data |"
            echo "| 5b policy parity (P03.06) | runs — **known failure**, tolerated by \`--ci\` only |"
            echo "| 6 browser (Chromium + one other) | **no** — no Playwright infrastructure exists |"
            echo "| 7 network-fault | **no** — needs a running app + fault injection |"
            echo "| 8 accessibility (keyboard/zoom/360px) | **partial** — accessible names covered by rendering tests |"
            echo ""
            echo "P12.04's acceptance treats a skipped critical check as a release failure."
            echo "A green run here means every row above except 5b, 6, 7 and 8 passed."
            echo "It is **not** a release verdict — that is \`npm run verify:release\`, which"
            echo "fails on all four."
          } >> "$GITHUB_STEP_SUMMARY"
